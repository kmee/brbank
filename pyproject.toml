[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brbank"
version = "0.1.0"
description = "Cobranca bancaria unificada (boleto e Pix) para bancos brasileiros, independente do Odoo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KMEE", email = "info@kmee.com.br" }]
dependencies = [
    "pydantic>=2.6",
    "httpx[http2]>=0.27",
    "cryptography>=50.0.2",
]

[project.entry-points."brbank.adapters"]
bb = "brbank.adapters.bb:BancoDoBrasilAdapter"
inter = "brbank.adapters.inter:InterAdapter"
pinbank = "brbank.adapters.pinbank:PinbankAdapter"
sicoob = "brbank.adapters.sicoob:SicoobAdapter"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/brbank"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
